[package]
name = "TopcoatTurso"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
dotenvy = "0.15.7"
lettre = { version = "0.11", features = ["builder", "hostname", "smtp-transport", "native-tls"] }
libsql = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
topcoat = "0.10.0"
uuid = { version = "1.28.0", features = ["v4"] }
