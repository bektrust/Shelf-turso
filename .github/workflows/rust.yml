name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Ubuntu 24.04, а не `ubuntu-latest`: тот же glibc, что у стека heroku-24.
    # `ubuntu-latest` с 19 октября 2026 переезжает на Ubuntu 26, и бинарник,
    # собранный там, на heroku-24 уже не запустится.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        # v5 работает на Node 24; v4 ещё держится, но GitHub выдаёт предупреждение.
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # Пишем в лог, что именно собралось: ELF под x86-64 и размер файла.
      - name: Show binary
        run: file target/release/TopcoatTurso && ls -lh target/release/TopcoatTurso

      # Готовый бинарник появляется внизу страницы запуска: Actions → нужный
      # run → раздел Artifacts. Живёт retention-days, потом GitHub его удаляет.
      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: TopcoatTurso-linux-x86_64
          path: target/release/TopcoatTurso
          # Если файла нет, лучше упасть, чем молча ничего не приложить.
          if-no-files-found: error
          retention-days: 14

  # Деплой в Heroku Container Registry. Отдельная job, а не шаг внутри `build`:
  # на pull request она не нужна вовсе, а на push её падение видно отдельно от
  # зелёной сборки.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Heroku принимает образы по адресу registry.heroku.com/<app>/<process>.
      # Пароль идёт через stdin, чтобы токен не оказался в списке аргументов.
      - name: Login to Heroku Container Registry
        run: echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      # Раннер уже x86_64, так что `--platform` здесь ничего не эмулирует.
      # `--provenance=false` — Heroku не понимает аттестации, которые buildx
      # по умолчанию прикладывает к образу.
      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            --tag registry.heroku.com/shelf-turso/web \
            .

      - name: Install Heroku CLI
        run: curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      # Release превращает загруженный образ в запущенный процесс.
      # scale — на случай свежего приложения, где web ещё не масштабирован.
      - name: Release the image
        run: |
          heroku container:release web -a shelf-turso
          heroku ps:scale web=1 -a shelf-turso
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
